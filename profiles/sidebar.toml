# Merge into Herdr's config.toml; reload config in the client menu.
# OmO: reference, project, current summary, then state and elapsed time.
[ui.sidebar.agents]
rows = [
  [{ token = "$omo_work_item", fg = "#89b4fa", bold = true, dim = false }],
  [{ token = "$omo_project", fg = "#bac2de", dim = false }],
  [{ token = "$omo_summary", fg = "#cdd6f4", dim = false, rules = [{ contains = "failed", fg = "#f38ba8", bold = true }, { contains = "input", fg = "#f9e2af", bold = true }] }],
  ["state_icon", "state_text", { token = "$omo_elapsed_compact", fg = "#a6adc8", dim = false }],
]

# Herdr 0.9.0 cannot override custom agents such as omo by name.
# Preserve native identity rows for every built-in agent instead.
[ui.sidebar.agents.rows_by_agent]
pi = [["state_icon", "machine", "workspace", "tab"], ["agent", "state_text"]]
